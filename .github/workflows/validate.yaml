name: Validate CI configuration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-cache:
    name: Build cache scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check build cache scopes
        run: ci/test-build-cache.sh
