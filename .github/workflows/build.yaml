name: Private candidate CI images

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      date:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_type:
        default: release-candidate
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  candidate-matrix:
    if: ${{ inputs.build_type == 'release-candidate' && startsWith(github.ref_name, 'release-test-') }}
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
      train: ${{ steps.context.outputs.train-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - uses: rapidsai/shared-actions/release-candidate-context@7ee1c5b75c3390fd3bb04ca125d66bc4d364ee26
        id: context
        with:
          source-sha: ${{ inputs.sha }}
      - name: Resolve frozen train and complete image matrix
        id: matrix
        env:
          TRAIN_SHA256: ${{ steps.context.outputs.train-sha256 }}
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          BUILD_DATE: ${{ inputs.date }}
        run: ci/resolve-candidate-train.sh
  candidate-images:
    needs: candidate-matrix
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix: ${{ fromJSON(needs.candidate-matrix.outputs.matrix) }}
    name: ${{ matrix.IMAGE_REPO }}, ${{ matrix.CUDA_VER }}, ${{ matrix.LINUX_VER }}, py${{ matrix.PYTHON_VER }}, ${{ matrix.ARCH }}
    runs-on: linux-${{ matrix.ARCH }}-cpu4
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      RAPIDS_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Isolate Docker registry configuration
        run: |
          candidate_docker_config=$(mktemp -d "${RUNNER_TEMP}/candidate-docker-config.XXXXXX")
          echo "DOCKER_CONFIG=${candidate_docker_config}" >> "${GITHUB_ENV}"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Prepare frozen candidate build inputs
        uses: rapidsai/shared-actions/release-candidate-dependencies@7ee1c5b75c3390fd3bb04ca125d66bc4d364ee26
        env:
          RELEASE_CANDIDATE_SHARED_ACTIONS_REPOSITORY: rapidsai/shared-actions
          RELEASE_CANDIDATE_SHARED_ACTIONS_REVISION: 7ee1c5b75c3390fd3bb04ca125d66bc4d364ee26
        with:
          candidate-train-sha256: ${{ needs.candidate-matrix.outputs.train }}
          artifact-family: container
          candidate-unit-id: container:ci-images
          implementation-mode: direct
          # These build images consume no train package dependencies or private channel.
          prepare-conda-channel: 'false'
          arch: ${{ matrix.ARCH }}
          cuda-version: ${{ matrix.CUDA_VER }}
          python-version: ${{ matrix.PYTHON_VER }}
      - name: Set up Docker Context for Buildx
        run: docker context create builders
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          endpoint: builders
          buildkitd-flags: --debug --config /etc/buildkit/buildkitd.toml
      - name: Generate frozen build arguments
        id: args
        env:
          RAPIDS_VERSION_MAJOR_MINOR: ${{ needs.candidate-matrix.outputs.version }}
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LINUX_VER: ${{ matrix.LINUX_VER }}
          PYTHON_VER: ${{ matrix.PYTHON_VER }}
          ARCH: ${{ matrix.ARCH }}
          IMAGE_REPO: ${{ matrix.IMAGE_REPO }}
        run: ci/compute-build-args.sh
      - name: Preserve the CI wheel base environment
        if: ${{ matrix.DOCKERFILE == 'ci-wheel.Dockerfile' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LINUX_VER: ${{ matrix.LINUX_VER }}
          DOCKERFILE: ${{ matrix.DOCKERFILE }}
        run: ci/sync-base-env.sh "nvidia/cuda:${CUDA_VER}-devel-${LINUX_VER}" "${DOCKERFILE}"
      - name: Prepare local archive directory
        run: mkdir -p .release-candidate-artifacts/container
      - name: Build the real CI image to an OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: context
          file: ${{ matrix.DOCKERFILE }}
          target: ${{ matrix.DOCKER_TARGET }}
          platforms: linux/${{ matrix.ARCH }}
          pull: true
          push: false
          build-args: ${{ steps.args.outputs.ARGS }}
          tags: docker.io/${{ matrix.IMAGE_NAME }}-${{ matrix.ARCH }}
          outputs: type=oci,dest=.release-candidate-artifacts/container/image.tar,oci-mediatypes=true
          provenance: false
          sbom: false
          secrets: |
            GH_TOKEN=${{ github.token }}
      - name: Freeze image package identity
        env:
          IMAGE_NAME: ${{ matrix.IMAGE_NAME }}
          ARCH: ${{ matrix.ARCH }}
          RAPIDS_VERSION_MAJOR_MINOR: ${{ needs.candidate-matrix.outputs.version }}
        run: ci/prepare-candidate-image.sh
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Publish run-bound private image catalog
        uses: rapidsai/shared-actions/release-catalog-dispatch@7ee1c5b75c3390fd3bb04ca125d66bc4d364ee26
        with:
          config: >-
            {"release_catalog_key":"container:ci-images",
            "artifact_directory":".release-candidate-artifacts/container",
            "artifacts":[{"path":"*.tar.gz","package_identity_file":"package-identity.json"}]}
          source-artifact-name: ci-images-${{ strategy.job-index }}-${{ matrix.ARCH }}
          candidate-train-sha256: ${{ needs.candidate-matrix.outputs.train }}
          candidate-matrix-arch: ${{ matrix.ARCH }}
          candidate-matrix-cuda-version: ${{ matrix.CUDA_VER }}
          candidate-matrix-python-version: ${{ matrix.PYTHON_VER }}
          upload-to-s3: 'true'
