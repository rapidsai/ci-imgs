name: publish
run-name: "publish${{ (inputs.upstream_repository != '') && format(' - triggered by: {0}', inputs.upstream_repository) || '' }}"

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        required: false
        type: string
      upstream_job:
        required: false
        type: string
      gha_tools_only:
        description: Refresh gha-tools on the published images without rebuilding dependencies
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    uses: $/.github/workflows/build-and-publish-images.yaml
    secrets:
      GPUCIBOT_DOCKERHUB_USER: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
      GPUCIBOT_DOCKERHUB_TOKEN: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
    with:
      build_type: branch
      gha_tools_only: ${{ inputs.gha_tools_only || inputs.upstream_repository == 'gha-tools' }}
    permissions:
      contents: read
      pull-requests: read
