name: One-off registry cache benchmark

on:
  push:
    branches: [pull-request/486]

permissions:
  contents: read

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[run-cache-benchmark]')
    name: baseline (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [ci-wheel, ci-conda]
    uses: $/.github/workflows/build-image.yaml
    secrets:
      GPUCIBOT_DOCKERHUB_USER: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
      GPUCIBOT_DOCKERHUB_TOKEN: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
    with:
      ARCHES: '["arm64"]'
      CUDA_VER: "13.4.3"
      LINUX_VER: rockylinux8
      PYTHON_VER: "3.14"
      IMAGE_REPO: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.image }}.Dockerfile
      ENABLE_CACHE: false
      IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-baseline
      MAIN_CACHE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-main
      CACHE_WRITE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-uncached

  seed:
    if: contains(github.event.head_commit.message, '[run-cache-benchmark]')
    name: seed (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [ci-wheel, ci-conda]
    uses: $/.github/workflows/build-image.yaml
    secrets:
      GPUCIBOT_DOCKERHUB_USER: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
      GPUCIBOT_DOCKERHUB_TOKEN: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
    with:
      ARCHES: '["arm64"]'
      CUDA_VER: "13.4.3"
      LINUX_VER: rockylinux8
      PYTHON_VER: "3.14"
      IMAGE_REPO: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.image }}.Dockerfile
      ENABLE_CACHE: true
      IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-seed
      MAIN_CACHE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-main
      CACHE_WRITE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-main

  shared:
    if: contains(github.event.head_commit.message, '[run-cache-benchmark]')
    needs: seed
    name: shared (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [ci-wheel, ci-conda]
    uses: $/.github/workflows/build-image.yaml
    secrets:
      GPUCIBOT_DOCKERHUB_USER: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
      GPUCIBOT_DOCKERHUB_TOKEN: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
    with:
      ARCHES: '["arm64"]'
      CUDA_VER: "13.4.3"
      LINUX_VER: rockylinux8
      PYTHON_VER: "3.14"
      IMAGE_REPO: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.image }}.Dockerfile
      ENABLE_CACHE: true
      IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-shared
      MAIN_CACHE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-main
      CACHE_WRITE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-scoped

  scoped:
    if: contains(github.event.head_commit.message, '[run-cache-benchmark]')
    needs: shared
    name: scoped (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [ci-wheel, ci-conda]
    uses: $/.github/workflows/build-image.yaml
    secrets:
      GPUCIBOT_DOCKERHUB_USER: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
      GPUCIBOT_DOCKERHUB_TOKEN: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
    with:
      ARCHES: '["arm64"]'
      CUDA_VER: "13.4.3"
      LINUX_VER: rockylinux8
      PYTHON_VER: "3.14"
      IMAGE_REPO: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.image }}.Dockerfile
      ENABLE_CACHE: true
      IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-scoped
      MAIN_CACHE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-main
      CACHE_WRITE_IMAGE_NAME: rapidsai/staging:cache-bench-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}-scoped

  summarize:
    if: always() && contains(github.event.head_commit.message, '[run-cache-benchmark]')
    needs: [baseline, seed, shared, scoped]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Summarize build-step timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/summarize-cache-benchmark.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-cache-benchmark
          path: |
            benchmark-summary.md
            benchmark-results.json
            benchmark-jobs.json
          if-no-files-found: warn
          retention-days: 14
