name: One-off gha-tools benchmark

on:
  # Opt-in branch pushes allow this one-off to run without registering it on main.
  push:
    branches: [codex/one-off-gha-tools-benchmark, codex/isolate-gha-tools-layer]
  workflow_dispatch:
    inputs:
      old_version:
        description: "Seed/bootstrap gha-tools version (previous = preceding stable release)"
        type: string
        default: previous
      new_version:
        description: "Updated runtime gha-tools version (latest = latest stable release)"
        type: string
        default: latest
      cuda_version:
        description: CUDA version
        type: string
        default: "13.3.0"
      python_version:
        description: Python version
        type: string
        default: "3.14"
      arch:
        description: Native runner architecture
        type: choice
        options: [arm64, amd64]
        default: arm64
      repetitions:
        description: "Paired repetitions per image (1–5; 5 recommended)"
        type: choice
        options: ["1", "3", "5"]
        default: "5"

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-gha-benchmark]') ||
      contains(github.event.head_commit.message, '[gha-benchmark-smoke]')
    runs-on: linux-${{ inputs.arch || 'arm64' }}-cpu4
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      repetitions: ${{ steps.prepare.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout frozen benchmark source including image pull optimizations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rapidsai/ci-imgs
          ref: 37b6aad265003b504922ad44f672bfbfa3bf1dd7
          path: benchmark-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Freeze inputs and prepare disposable Dockerfiles
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_SOURCE_DIR: benchmark-source
          OLD_VERSION: ${{ inputs.old_version || 'previous' }}
          NEW_VERSION: ${{ inputs.new_version || 'latest' }}
          CUDA_VER: ${{ inputs.cuda_version || '13.3.0' }}
          PYTHON_VER: ${{ inputs.python_version || '3.14' }}
          REPETITIONS: ${{ inputs.repetitions || (contains(github.event.head_commit.message, '[gha-benchmark-smoke]') && '1' || '5') }}
        run: |
          ci/one-off-gha-tools/prepare.sh
          tar -C benchmark-source -cf benchmark-inputs.tar prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-inputs
          path: benchmark-inputs.tar
          retention-days: 14
          if-no-files-found: error

  benchmark:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: linux-${{ inputs.arch || 'arm64' }}-cpu4
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: benchmark-inputs
          path: .
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.GPUCIBOT_DOCKERHUB_USER }}
          password: ${{ secrets.GPUCIBOT_DOCKERHUB_TOKEN }}
      - name: Run paired builds with independent registry caches
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          REPETITION: ${{ matrix.repetition }}
          ARCH: ${{ inputs.arch || 'arm64' }}
        run: |
          tar -xf benchmark-inputs.tar
          bash prepared/run.sh
      - name: Preserve results, including failed builds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-${{ matrix.image }}-${{ matrix.repetition }}
          path: prepared/results/
          retention-days: 14
          if-no-files-found: warn

  summarize:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: benchmark-results-*
          path: results
          merge-multiple: true
      - name: Summarize elapsed times
        env:
          EXPECTED_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: ci/one-off-gha-tools/summarize.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-summary
          path: |
            summary.md
            results.json
          retention-days: 14
